<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Código QR de Asistencia</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --cyan: #36e6ff;
    }
    * { box-sizing: border-box; }
    body {
      background:
        radial-gradient(ellipse at 15% 10%, rgba(59, 130, 246, 0.2), transparent 42%),
        radial-gradient(ellipse at 90% 90%, rgba(54, 230, 255, 0.1), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 1.25rem;
      padding: 1.5rem;
      text-align: center;
    }
    h2 {
      max-width: 600px;
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2rem);
      animation: entrada 550ms 80ms both;
    }
    .qr-container {
      background: #fff;
      padding: clamp(1rem, 5vw, 1.5rem);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.38), 0 0 0 1px rgba(54, 230, 255, 0.12);
      display: flex;
      justify-content: center;
      align-items: center;
      animation: entrada 650ms 180ms both;
      transition: transform 220ms ease, box-shadow 220ms ease;
    }
    .qr-container:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.42), 0 0 28px rgba(54, 230, 255, 0.2);
    }
    img {
      display: block;
      width: min(300px, 70vw);
      height: auto;
    }
    p {
      max-width: min(600px, 90vw);
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      overflow-wrap: anywhere;
      animation: entrada 500ms 300ms both;
    }
    @keyframes entrada {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <h2>Escanea para registrar tu asistencia</h2>
  <div class="qr-container">
    <img src="/api/qr.svg" alt="Código QR de Asistencia" />
  </div>
  <p id="url-label">Cargando enlace...</p>

  <script>
    fetch('/api/config')
      .then(r => r.json())
      .then(cfg => {
        const label = document.getElementById('url-label');
        if (cfg.mobileUrl) {
          label.textContent = cfg.mobileUrl;
        } else {
          label.textContent = 'Configura PUBLIC_URL en las variables de entorno para generar el enlace completo.';
        }
      });
  </script>
</body>
</html>
