<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Asistencia</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --error: #ef4444;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      background-image:
        radial-gradient(ellipse at 15% 10%, rgba(59, 130, 246, 0.16), transparent 38%),
        radial-gradient(ellipse at 90% 90%, rgba(34, 197, 94, 0.08), transparent 35%);
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 540px;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      animation: entrada-panel 650ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
    }

    h2 {
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
      text-align: center;
      animation: entrada-contenido 500ms 100ms both;
    }
    .campo {
      display: flex;
      flex-direction: column;
      margin-bottom: 1rem;
      gap: 0.4rem;
      animation: entrada-contenido 450ms 160ms both;
    }
    .campo span { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; color: var(--text-muted); }
    
    input[type="text"], select {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem;
      border-radius: 6px;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
    }
    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
      background-color: #111d33;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 480px) { .fila { grid-template-columns: 1fr; } }

    .grupo-titulo {
      margin: 1.25rem 0 0.5rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.25rem;
      animation: entrada-contenido 450ms 220ms both;
    }

    .opciones {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .opcion-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #162032;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid transparent;
      user-select: none;
      transition: transform 180ms ease, border-color 180ms ease, background-color 180ms ease;
      animation: entrada-contenido 400ms both;
    }
    .opcion-item:nth-child(1) { animation-delay: 240ms; }
    .opcion-item:nth-child(2) { animation-delay: 290ms; }
    .opcion-item:nth-child(3) { animation-delay: 340ms; }
    .opcion-item:nth-child(4) { animation-delay: 390ms; }
    .opcion-item:hover {
      border-color: var(--primary);
      background: #1b2b45;
      transform: translateX(3px);
    }
    .opcion-item input { accent-color: var(--primary); cursor: pointer; }

    .btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.85rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease, box-shadow 180ms ease;
      margin-top: 1rem;
      animation: entrada-contenido 450ms 400ms both;
    }
    .btn:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 7px 18px rgba(37, 99, 235, 0.28);
    }
    .btn:active:not(:disabled) { transform: translateY(0) scale(0.99); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    #mensaje {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
    #mensaje.error, #mensaje.success {
      display: block;
      animation: entrada-mensaje 220ms ease-out both;
    }
    #mensaje.error { background: rgba(239, 68, 68, 0.15); color: var(--error); border: 1px solid var(--error); }
    #mensaje.success { background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid var(--success); }

    @keyframes entrada-panel {
      from { opacity: 0; transform: translateY(18px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes entrada-contenido {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes entrada-mensaje {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <main>
    <section class="panel" style="--i:0">
      <div class="in">
        <h2>Registrar asistencia</h2>
        <form id="formulario" novalidate autocomplete="off">
          <label class="campo"><span>NOMBRE</span>
            <input type="text" id="nombre" placeholder="Tu nombre completo" required />
          </label>

          <div class="fila">
            <label class="campo"><span>SEMESTRE</span>
              <select id="semestre" required>
                <option value="">Selecciona...</option>
              </select>
            </label>
            <label class="campo"><span>DÍA DE LA CONFERENCIA</span>
              <select id="dia-conferencia">
                <option value="">Selecciona...</option>
              </select>
            </label>
          </div>

          <label class="campo"><span>DÍA DEL TALLER</span>
            <select id="dia-taller">
              <option value="">Selecciona...</option>
            </select>
          </label>

          <div class="grupo-titulo"><span>CONFERENCIAS</span></div>
          <div class="opciones" id="lista-conferencias"></div>

          <div class="grupo-titulo"><span>TALLERES</span></div>
          <div class="opciones" id="lista-talleres"></div>

          <button type="submit" class="btn" id="btn-submit"><span>REGISTRAR</span></button>
          <div id="mensaje" role="status"></div>
        </form>
      </div>
    </section>
  </main>

  <script>
    const SEMESTRES = ["1er Semestre", "2do Semestre", "3er Semestre", "4to Semestre", "5to Semestre", "6to Semestre", "7mo Semestre", "8vo Semestre", "Egresado / Externo"];

    const form = document.getElementById('formulario');
    const selectSemestre = document.getElementById('semestre');
    const selectDiaConf = document.getElementById('dia-conferencia');
    const selectDiaTaller = document.getElementById('dia-taller');
    const contenedorConf = document.getElementById('lista-conferencias');
    const contenedorTalleres = document.getElementById('lista-talleres');
    const mensajeBox = document.getElementById('mensaje');
    const btnSubmit = document.getElementById('btn-submit');

    // 1. Poblar semestres
    SEMESTRES.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      selectSemestre.appendChild(opt);
    });

    // 2. Cargar opciones del servidor (/api/opciones)
    async function inicializarOpciones() {
      try {
        const res = await fetch('/api/opciones');
        if (!res.ok) throw new Error('Error al consultar opciones.');
        const data = await res.json();

        // Días
        data.dias.forEach(dia => {
          selectDiaConf.add(new Option(dia, dia));
          selectDiaTaller.add(new Option(dia, dia));
        });

        // Conferencias (Checkboxes)
        data.conferencias.forEach(conf => {
          contenedorConf.appendChild(crearItemCheckbox(conf, 'conf'));
        });

        // Talleres (Checkboxes)
        data.talleres.forEach(taller => {
          contenedorTalleres.appendChild(crearItemCheckbox(taller, 'taller'));
        });
      } catch (err) {
        mostrarMensaje('No se pudieron cargar las conferencias y talleres: ' + err.message, 'error');
      }
    }

    function crearItemCheckbox(texto, grupo) {
      const label = document.createElement('label');
      label.className = 'opcion-item';
      
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.name = grupo;
      checkbox.value = texto;

      const span = document.createElement('span');
      span.textContent = texto;

      label.appendChild(checkbox);
      label.appendChild(span);
      return label;
    }

    function mostrarMensaje(texto, tipo) {
      mensajeBox.textContent = texto;
      mensajeBox.className = tipo;
    }

    // 3. Envío al endpoint /api/asistencias
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mensajeBox.className = '';
      mensajeBox.textContent = '';

      const nombre = document.getElementById('nombre').value.trim();
      const semestre = selectSemestre.value;
      const diaConferencia = selectDiaConf.value;
      const diaTaller = selectDiaTaller.value;

      const conferencias = Array.from(document.querySelectorAll('input[name="conf"]:checked')).map(el => el.value);
      const talleres = Array.from(document.querySelectorAll('input[name="taller"]:checked')).map(el => el.value);

      // Validaciones espejo del servidor
      if (!nombre || !semestre) {
        return mostrarMensaje('Completa nombre y semestre.', 'error');
      }
      if (conferencias.length === 0 && talleres.length === 0) {
        return mostrarMensaje('Selecciona al menos una conferencia o taller.', 'error');
      }
      if (conferencias.length > 0 && !diaConferencia) {
        return mostrarMensaje('Selecciona el día para la conferencia.', 'error');
      }
      if (talleres.length > 0 && !diaTaller) {
        return mostrarMensaje('Selecciona el día para el taller.', 'error');
      }

      btnSubmit.disabled = true;

      try {
        const res = await fetch('/api/asistencias', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre,
            semestre,
            diaConferencia,
            diaTaller,
            conferencias,
            talleres
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Ocurrió un error al registrar.');

        mostrarMensaje('¡Asistencia registrada correctamente!', 'success');
        form.reset();
      } catch (err) {
        mostrarMensaje(err.message, 'error');
      } finally {
        btnSubmit.disabled = false;
      }
    });

    inicializarOpciones();
  </script>
</body>
</html>
